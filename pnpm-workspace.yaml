packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency build scripts unless they are approved here. Committing the
# approvals keeps `pnpm install` non-interactive on a fresh machine, which the README
# depends on.
allowBuilds:
  # tsx's engine; its postinstall links the platform binary.
  esbuild: true
  # Transformers.js's inference backend — the embedding model cannot run without it.
  onnxruntime-node: true
  # Pulled in by onnxruntime-node; its postinstall only wires up its own CLI.
  protobufjs: true
  # Transformers.js uses sharp for image pipelines. We only embed text, but a
  # half-installed sharp would break importing the package at all.
  sharp: true

# drizzle-kit loads its config through the retired @esbuild-kit loader, which pins an esbuild
# with a published advisory (GHSA-67mh-4wv8-2f99). No drizzle-kit release drops the loader, so
# it gets the esbuild drizzle-kit itself uses. Remove once drizzle-kit stops depending on it.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.56'
  - '@ai-sdk/google@4.0.47'
  - '@ai-sdk/provider-utils@5.0.28'
  - ai@7.0.70
  - lucide-react@1.33.0
